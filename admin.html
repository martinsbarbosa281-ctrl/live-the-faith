<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Gerenciamento de Produtos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f1f5f9;
            --header-bg: #1e293b;
            --white: #ffffff;
            --text-main: #1e293b;
            --border-color: #475569; /* Borda bem mais forte e escura */
            --border-focus: #0284c7;  /* Azul forte para destaque ao focar */
            --primary-yellow: #ca8a04;
            --primary-yellow-hover: #a16207;
            --badge-green: #15803d;
            --btn-voltar: #0284c7;
            --btn-voltar-hover: #0369a1;
            --btn-logout: #b91c1c;
            --btn-logout-hover: #991b1b;
            --table-header-bg: #f8fafc;
            --transition: all 0.25s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        a:focus, button:focus, input:focus, textarea:focus, select:focus {
            outline: 3px solid #38bdf8 !important;
            outline-offset: 2px !important;
        }

        header {
            background: var(--header-bg);
            color: var(--white);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .header-left {
            font-size: 20px;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .badge {
            background: var(--badge-green);
            color: var(--white);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .voltar { background: var(--btn-voltar); color: white; }
        .voltar:hover { background: var(--btn-voltar-hover); transform: translateY(-1px); }

        .logout { background: var(--btn-logout); color: white; }
        .logout:hover { background: var(--btn-logout-hover); transform: translateY(-1px); }

        .container {
            background: var(--white);
            padding: 30px;
            border-radius: 16px;
            margin: 25px auto;
            max-width: 1100px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            border: 2px solid #cbd5e1; /* Borda externa do container mais firme */
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-full {
            grid-column: span 2;
        }

        .input-group {
            margin-bottom: 8px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 5px;
        }

        /* Campos com bordas fortes e espessura maior */
        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
            color: var(--text-main);
            background: #ffffff; /* Fundo limpo para destacar a borda */
            transition: var(--transition);
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--border-focus);
            background: var(--white);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        #tamanhosBox {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 2px dashed var(--border-color);
            margin: 10px 0;
        }

        .salvar {
            background: var(--primary-yellow);
            color: #ffffff;
            width: 100%;
            max-width: 200px;
            padding: 12px 20px;
            font-size: 15px;
            margin-top: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .salvar:hover {
            background: var(--primary-yellow-hover);
            transform: translateY(-1px);
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }

        th {
            background: var(--table-header-bg);
            color: #1e293b;
            font-weight: 700;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #cbd5e1;
        }

        th, td {
            padding: 14px 16px;
            text-align: center;
            font-size: 14px;
            border-bottom: 1px solid #cbd5e1;
            vertical-align: middle;
        }

        td:first-child, th:first-child {
            text-align: left;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        .produto-img-mini {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            object-fit: cover;
            border: 2px solid #94a3b8;
            background: #94a3b8;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        .produto-nome-wrapper {
            display: flex;
            align-items: center;
        }

        .edit { background: var(--badge-green); color: white; }
        .edit:hover { background: #166534; }

        .delete { background: var(--btn-logout); color: white; }
        .delete:hover { background: #7f1d1d; }

        .btn-action-group {
            display: flex;
            justify-content: center;
            gap: 6px;
        }

        .btn-action-group button {
            margin: 0;
            padding: 6px 12px;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-full {
                grid-column: span 1;
            }
            header {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            .container {
                margin: 15px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<header role="banner">
    <div class="header-left">Painel Admin</div>
    <div class="header-right">
        <span class="badge" aria-label="Status: Logado como Administrador">Logado como Admin</span>
        <button class="btn voltar" onclick="voltarLoja()" aria-label="Voltar para a página da loja">Voltar à loja</button>
        <button class="btn logout" onclick="logout()" aria-label="Sair do painel administrativo">Sair</button>
    </div>
</header>

<main role="main">
    <div class="container">
        <h2>Adicionar Produto</h2>

        <div class="form-grid">
            <div class="input-group">
                <label for="nome">Nome do produto</label>
                <input id="nome" type="text" placeholder="Ex: Camiseta Básica" aria-required="true">
            </div>

            <div class="input-group">
                <label for="preco">Preço (R$)</label>
                <input id="preco" type="text" placeholder="Ex: 59.90" aria-required="true">
            </div>

            <div class="input-group">
                <label for="imagem">URL da imagem (Frente)</label>
                <input id="imagem" type="url" placeholder="https://exemplo.com/frente.jpg" aria-required="true">
            </div>

            <div class="input-group">
                <label for="imagem_costas">URL da imagem (Costas - Opcional)</label>
                <input id="imagem_costas" type="url" placeholder="https://exemplo.com/costas.jpg">
            </div>

            <div class="input-group form-full">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" placeholder="Descreva os detalhes e diferenciais do produto..." aria-required="true"></textarea>
            </div>

            <div class="input-group">
                <label for="tipoProduto">Tipo de Produto</label>
                <select id="tipoProduto">
                    <option value="simples">Produto comum</option>
                    <option value="roupa">Roupa (com tamanhos)</option>
                </select>
            </div>

            <div class="input-group" id="estoqueBoxContainer">
                <label for="estoque">Quantidade em Estoque</label>
                <div id="estoqueBox">
                    <input id="estoque" type="number" min="0" placeholder="Ex: 50">
                </div>
            </div>

            <div class="input-group form-full" id="tamanhosContainer" style="display:none;">
                <label>Grades de Tamanhos (P, M, G)</label>
                <div id="tamanhosBox">
                    <div>
                        <label for="tamP" style="font-size:11px; margin-bottom:2px;">Qtd P</label>
                        <input id="tamP" type="number" min="0" placeholder="0">
                    </div>
                    <div>
                        <label for="tamM" style="font-size:11px; margin-bottom:2px;">Qtd M</label>
                        <input id="tamM" type="number" min="0" placeholder="0">
                    </div>
                    <div>
                        <label for="tamG" style="font-size:11px; margin-bottom:2px;">Qtd G</label>
                        <input id="tamG" type="number" min="0" placeholder="0">
                    </div>
                </div>
            </div>
        </div>

        <button class="btn salvar" onclick="adicionarProduto()">Salvar Produto</button>
    </div>

    <div class="container">
        <h2>Produtos Cadastrados</h2>
        <div class="table-responsive" id="lista" tabindex="0" aria-label="Tabela de produtos cadastrados"></div>
    </div>
</main>

<script>
function lerCookie(nome) {
    const nomeIgual = nome + "=";
    const array = document.cookie.split(';');
    for(let i = 0; i < array.length; i++) {
        let c = array[i].trim();
        if (c.indexOf(nomeIgual) == 0) return c.substring(nomeIgual.length, c.length);
    }
    return null;
}

const adminCookie = lerCookie("usuario_admin");
const adminLocal = localStorage.getItem("usuarioAdmin");

if (adminCookie !== "1" && adminLocal !== "1") {
    alert("Acesso negado! Área restrita para administradores.");
    window.location.href = "index.html";
}

function voltarLoja(){
    window.location.href = "index.html";
}

function logout(){
    localStorage.removeItem("usuarioId");
    localStorage.removeItem("usuarioNome");
    localStorage.removeItem("usuarioAdmin");
    
    document.cookie = "usuario_logado=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    document.cookie = "usuario_id=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    document.cookie = "usuario_admin=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    
    alert("Você saiu do painel admin");
    window.location.href = "index.html";
}

document.getElementById("tipoProduto").addEventListener("change", function(){
    if(this.value === "roupa") {
        document.getElementById("tamanhosContainer").style.display = "block";
        document.getElementById("estoqueBoxContainer").style.display = "none";
    } else {
        document.getElementById("tamanhosContainer").style.display = "none";
        document.getElementById("estoqueBoxContainer").style.display = "block";
    }
});

function carregarProdutos(){
    fetch("listar.php")
    .then(r => r.json())
    .then(data => {
        if(!Array.isArray(data)){
            console.error("Erro listar.php:", data);
            return;
        }

        let html = `
        <table>
            <thead>
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Preço</th>
                    <th scope="col">Estoque / Grades</th>
                    <th scope="col">Descrição</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>`;

        data.forEach(p => {
            let infoEstoque = p.quantidade_estoque || 0;

            if(p.tipo === "roupa"){
                try {
                    const obj = JSON.parse(p.tamanhos || "{}");
                    infoEstoque = Object.entries(obj)
                        .map(([t, q]) => `<strong>${t}</strong>: ${q}`)
                        .join(" | ");
                } catch(e) {
                    infoEstoque = "Erro na grade";
                }
            }

            let imgTag = p.imagem ? `<img src="${p.imagem}" alt="Foto do produto ${p.nome}" class="produto-img-mini" onerror="this.style.display='none'">` : '';

            html += `
            <tr>
                <td>
                    <div class="produto-nome-wrapper">
                        ${imgTag}
                        <strong>${p.nome}</strong>
                    </div>
                </td>
                <td>R$ ${parseFloat(p.preco).toFixed(2)}</td>
                <td>${infoEstoque}</td>
                <td style="max-width: 280px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${p.descricao}">${p.descricao}</td>
                <td>
                    <div class="btn-action-group">
                        <button class="btn edit" aria-label="Editar produto ${p.nome}" onclick='editar(${p.id}, ${JSON.stringify(p.nome)}, ${JSON.stringify(p.preco)}, ${JSON.stringify(p.descricao)})'>
                            Editar
                        </button>
                        <button class="btn delete" aria-label="Excluir produto ${p.nome}" onclick="deletar(${p.id})">
                            Excluir
                        </button>
                    </div>
                </td>
            </tr>`;
        });

        html += "</tbody></table>";
        document.getElementById("lista").innerHTML = html;
    })
    .catch(err => console.error("Erro fetch:", err));
}

function adicionarProduto(){
    const nomeEl = document.getElementById("nome");
    const precoEl = document.getElementById("preco");
    const imagemEl = document.getElementById("imagem");
    const imagemCostasEl = document.getElementById("imagem_costas"); 
    const descricaoEl = document.getElementById("descricao");
    const estoqueEl = document.getElementById("estoque");
    const tipo = document.getElementById("tipoProduto").value;

    if(!nomeEl || !precoEl || !imagemEl || !imagemCostasEl || !descricaoEl || !estoqueEl){ 
        alert("Erro estrutural: Elementos HTML não encontrados.");
        return;
    }

    const nome = nomeEl.value.trim();
    const preco = precoEl.value.trim().replace(",", ".");
    const imagem = imagemEl.value.trim();
    const imagem_costas = imagemCostasEl.value.trim(); 
    const descricao = descricaoEl.value.trim();
    
    let quantidade_estoque = parseInt(estoqueEl.value) || 0;
    let tamanhos = "";

    if(!nome || !preco || !imagem || !descricao){
        alert("Por favor, preencha Nome, Preço, Imagem da Frente e Descrição!");
        return;
    }

    if(tipo === "roupa"){
        const qtoP = parseInt(document.getElementById("tamP").value) || 0;
        const qtoM = parseInt(document.getElementById("tamM").value) || 0;
        const qtoG = parseInt(document.getElementById("tamG").value) || 0;

        quantidade_estoque = qtoP + qtoM + qtoG; 
        
        tamanhos = JSON.stringify({
            P: qtoP,
            M: qtoM,
            G: qtoG
        });
    }

    fetch("produtos_add.php", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: new URLSearchParams({
            nome,
            preco,
            imagem,
            imagem_costas, 
            descricao,
            quantidade_estoque,
            tipo,
            tamanhos
        })
    })
    .then(r => r.text())
    .then(text => {
        try {
            const data = JSON.parse(text);
            alert(data.mensagem);

            if(data.status === "ok"){
                nomeEl.value = "";
                precoEl.value = "";
                imagemEl.value = "";
                imagemCostasEl.value = "";
                descricaoEl.value = "";
                estoqueEl.value = "";
                document.getElementById("tamP").value = "";
                document.getElementById("tamM").value = "";
                document.getElementById("tamG").value = "";
                
                carregarProdutos();
            }
        } catch(e) {
            console.error("Erro PHP:", text);
            alert("Erro no processamento do servidor.");
        }
    });
}

function deletar(id){
    if(confirm("Tem certeza que deseja excluir este produto?")){
        fetch("produtos_delete.php?id=" + id)
        .then(() => carregarProdutos());
    }
}

function editar(id, nome, preco, descricao){
    const n = prompt("Novo nome:", nome);
    const p = prompt("Novo preço:", preco);
    const d = prompt("Nova descrição:", descricao);

    if(!n || !p || !d) return;

    fetch("produtos_edit.php", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: new URLSearchParams({
            id,
            nome: n,
            preco: p.replace(",", "."),
            descricao: d
        })
    })
    .then(r => r.json())
    .then(data => {
        alert(data.mensagem || "Atualizado!");
        if(data.status === "ok") carregarProdutos();
    });
}

carregarProdutos();
</script>
</body>
</html>
